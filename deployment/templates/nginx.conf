server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    return 301 https://$host:__HTTPS_PORT__$request_uri;
}

server {
    listen __HTTPS_PORT__ ssl;
    listen [::]:__HTTPS_PORT__ ssl;
    server_name __PUBLIC_HOST__;

    ssl_certificate /etc/myhealth/pki/server.crt;
    ssl_certificate_key /etc/myhealth/pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MyHealthSSL:10m;
    ssl_session_timeout 10m;

    ssl_client_certificate /etc/myhealth/pki/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    error_page 495 496 =403 @client_certificate_required;

    root /opt/myhealth/current/client;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @client_certificate_required {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 403 '{"error":"Для доступа необходим клиентский сертификат"}';
    }
}
